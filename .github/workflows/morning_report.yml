name: 아침 뉴스 리포트 메일 발송

# analyze.yml 은 과제 제출용으로 2026-08-14 단 1회만 돌도록 고정돼 있어
# 건드리지 않는다. 이 워크플로는 그것과 별개로, 매일 아침 전체 파이프라인
# (수집 → 정제 → 요약 → 분석 → 리포트) 을 돌리고 결과를 이메일로 보낸다.
on:
  schedule:
    # 매일 07:00 KST = 전날 22:00 UTC
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning-report:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 설정
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # matplotlib 한글 폰트 (--attach-charts 옵션으로 차트를 첨부할 경우 필요)
      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          fc-cache -f
          rm -rf ~/.cache/matplotlib

      - name: 저장 경로 확인
        run: |
          python - <<'PY' | tee -a "$GITHUB_ENV"
          import json
          conf = json.load(open("config.json", encoding="utf-8"))
          paths = conf.get("paths", {})
          print("RAW_DIR=" + paths.get("raw", "data/raw"))
          print("CLEAN_DIR=" + paths.get("clean", "data/clean"))
          print("ANALYZED_DIR=" + paths.get("analyzed", "data/analyzed"))
          print("OUTPUT_DIR=" + conf.get("report", {}).get("output_directory", "output"))
          PY

      # --- 1. 수집 ---------------------------------------------------
      - name: Google News 수집
        run: python main.py fetch --source google --limit 20

      - name: GOV.UK 수집
        run: python main.py fetch --source govuk --limit 20

      # --- 2. 정제 ---------------------------------------------------
      - name: 데이터 정제
        run: python main.py clean --policy upsert

      # --- 3. AI 요약 + 감성 분석 -------------------------------------
      - name: AI 요약·감성 분석
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py summarize

      # --- 4. AI 트렌드 분석 -------------------------------------------
      - name: AI 트렌드 분석
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py analyze

      # --- 5. 리포트 생성 ------------------------------------------
      - name: 리포트·차트 생성
        run: python main.py report --format both

      # --- 6. 이메일 발송 ------------------------------------------
      - name: 리포트 이메일 발송
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py mail --attach-charts

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$RAW_DIR"/*.jsonl "$CLEAN_DIR"/*.jsonl "$ANALYZED_DIR"/* \
                  "$OUTPUT_DIR"/reports logs/*.log
          git diff --cached --quiet && echo "변경사항 없음" || git commit -m "chore: 아침 리포트 반영 ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push