name: 정기 뉴스 수집

# 예약 실행은 꺼 두었다. daily_report.yml 이 수집부터 메일까지 한 번에 돌리는데,
# 이 워크플로까지 매일 돌면 같은 파일을 두 번 커밋해 push 가 서로 밀어낸다.
# 수집·정제만 따로 확인하고 싶을 때 "Run workflow" 로 수동 실행한다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 설정
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 저장 경로를 config.json 에서 읽어 온다.
      # 여기서 하드코딩하면 config 의 paths 를 바꿨을 때 커밋 단계가
      # 엉뚱한 위치를 보게 되므로, 코드와 같은 값을 쓰도록 맞춰 둔다.
      - name: 저장 경로 확인
        run: |
          python - <<'PY' | tee -a "$GITHUB_ENV"
          import json
          paths = json.load(open("config.json", encoding="utf-8")).get("paths", {})
          print("RAW_DIR=" + paths.get("raw", "data/raw"))
          print("CLEAN_DIR=" + paths.get("clean", "data/clean"))
          PY

      - name: 기준일 결정 (KST)
        run: echo "TARGET_DATE=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_ENV"

      - name: Google News 수집
        run: python main.py fetch --source google --limit 40 --date "$TARGET_DATE"

      - name: NAVER News 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python main.py fetch --source naver --limit 40 --date "$TARGET_DATE"

      - name: GOV.UK 수집
        run: python main.py fetch --source govuk --limit 20 --date "$TARGET_DATE"

      - name: 데이터 정제
        run: python main.py clean --policy upsert --date "$TARGET_DATE"

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$RAW_DIR"/*.jsonl "$CLEAN_DIR"/*.jsonl logs/collector.log
          if git diff --cached --quiet; then
            echo "변경사항 없음"
            exit 0
          fi
          git commit -m "chore: 뉴스 수집 결과 반영 ($TARGET_DATE)"
          git pull --rebase origin main
          git push
