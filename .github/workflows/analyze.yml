name: 정기 분석·리포트

# 수집·정제만 매일 도는 collect.yml 과 달리, 이 워크플로는 파이프라인을
# 처음부터 끝까지(수집 → 정제 → 요약 → 분석 → 리포트 → 내보내기) 한 번에 돌린다.
#
# 수집·정제는 collect.yml 이 매일 돌리고, 비용이 드는 AI 단계까지 포함한
# 전체 실행은 이 워크플로가 맡는다.
#
# 과제 제출로 프로젝트가 마무리되므로, 예약 실행은 2026-08-14 06:30 KST
# "딱 한 번"만 하도록 걸어 두었다. cron 에는 연도 필드가 없어서 날짜만으로는
# 매년 반복되기 때문에, 아래 guard 잡에서 실행일을 확인해 그날이 아니면 건너뛴다.
# 제출 이후에도 필요하면 "Run workflow" 로 언제든 수동 실행할 수 있다(날짜 무관).
on:
  schedule:
    # 2026-08-14 06:30 KST = 2026-08-13 21:30 UTC (KST 는 UTC+9 라 날짜가 하루 당겨진다)
    # collect.yml 이 21:00 에 돌고 push 하므로, 30분 뒤로 밀어 충돌을 피한다.
    - cron: "30 21 13 8 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 예약 실행이 지정한 하루에만 진행되도록 거르는 잡.
  # 수동 실행(workflow_dispatch)은 날짜와 무관하게 항상 통과시킨다.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: 실행일 확인
        id: check
        env:
          RUN_ON: "2026-08-14"   # 유일하게 예약 실행할 날짜 (KST)
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "수동 실행 -> 진행"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=Asia/Seoul date +%F)
          if [ "$today" = "$RUN_ON" ]; then
            echo "예약일($RUN_ON) 도달 -> 진행"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "예약일이 아님 (오늘 KST $today, 예약일 $RUN_ON) -> 건너뜀"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 설정
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # matplotlib 은 시스템에 설치된 폰트만 쓴다. ubuntu 러너에는 한글 폰트가
      # 없어서, 설치하지 않으면 차트의 한글이 전부 네모(□)로 깨진다.
      # visualizer.KOREAN_FONT_CANDIDATES 가 NanumGothic 을 찾으므로 그것을 깐다.
      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          fc-cache -f
          # matplotlib 이 폰트 목록을 캐시해 두기 때문에, 지워야 새로 깐 폰트를 인식한다
          rm -rf ~/.cache/matplotlib

      # 저장 경로를 config.json 에서 읽어 온다. 여기서 하드코딩하면
      # config 의 paths 를 바꿨을 때 커밋 단계가 엉뚱한 위치를 보게 된다.
      - name: 저장 경로 확인
        run: |
          python - <<'PY' | tee -a "$GITHUB_ENV"
          import json
          conf = json.load(open("config.json", encoding="utf-8"))
          paths = conf.get("paths", {})
          print("RAW_DIR=" + paths.get("raw", "data/raw"))
          print("CLEAN_DIR=" + paths.get("clean", "data/clean"))
          print("ANALYZED_DIR=" + paths.get("analyzed", "data/analyzed"))
          print("OUTPUT_DIR=" + conf.get("report", {}).get("output_directory", "output"))
          PY

      # --- 1. 수집 ---------------------------------------------------
      - name: Google News 수집
        run: python main.py fetch --source google --limit 20

      - name: NAVER News 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python main.py fetch --source naver --limit 20

      - name: GOV.UK 수집
        run: python main.py fetch --source govuk --limit 20

      # --- 2. 정제 ---------------------------------------------------
      - name: 데이터 정제
        run: python main.py clean --policy upsert

      # --- 3. AI 요약 + 감성 분석 ------------------------------------
      # 아직 요약되지 않은 기사만 처리하므로, 그동안 쌓인 분량이 많아도
      # 이미 끝난 건은 건너뛴다.
      - name: AI 요약·감성 분석
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py summarize

      # --- 4. AI 트렌드 분석 -----------------------------------------
      # 조건 없이 전체 기준으로 돌려야 리포트의 집계와 모집단이 맞는다.
      - name: AI 트렌드 분석
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py analyze

      # --- 5. 리포트 + 내보내기 --------------------------------------
      - name: 리포트·차트 생성
        run: python main.py report --format both

      - name: 데이터 내보내기
        run: python main.py export --format all

      # exports 는 .gitignore 대상이라 커밋되지 않는다.
      # 대신 워크플로 아티팩트로 올려 두어 필요할 때 내려받을 수 있게 한다.
      - name: 내보내기 결과 업로드
        uses: actions/upload-artifact@v7
        with:
          name: news-export
          path: ${{ env.OUTPUT_DIR }}/exports/
          retention-days: 30
          if-no-files-found: warn

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 리포트는 실행마다 폴더 하나(report_<시각>/)가 새로 생기고 그 안에
          # 차트까지 들어가므로, reports 아래를 통째로 담는다.
          git add "$RAW_DIR"/*.jsonl "$CLEAN_DIR"/*.jsonl "$ANALYZED_DIR"/* \
                  "$OUTPUT_DIR"/reports logs/*.log
          git diff --cached --quiet && echo "변경사항 없음" || git commit -m "chore: 정기 분석·리포트 결과 반영 ($(date -u +%Y-%m-%d))"
          # collect.yml 이 먼저 push 했을 수 있으므로 최신 상태에 얹는다
          git pull --rebase origin main
          git push
